basePath: /api
definitions:
  error.APIError:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  handler.CreateCourseInput:
    properties:
      description:
        example: Introduction to Mathematics
        type: string
      title:
        example: Math 101
        maxLength: 100
        minLength: 3
        type: string
    required:
    - title
    type: object
  model.Assignment:
    properties:
      course_id:
        example: 1
        type: integer
      created_at:
        example: "2025-04-18T12:00:00Z"
        type: string
      description:
        example: Test Description
        type: string
      due_date:
        example: "2025-04-19T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      max_score:
        example: 100
        minimum: 0
        type: integer
      teacher:
        $ref: '#/definitions/model.User'
      title:
        example: Test Assignment
        maxLength: 100
        minLength: 3
        type: string
      updated_at:
        example: "2025-04-18T12:00:00Z"
        type: string
    required:
    - course_id
    - due_date
    - max_score
    - title
    type: object
  model.Course:
    properties:
      created_at:
        example: "2025-04-18T12:00:00Z"
        type: string
      description:
        example: Introduction to Mathematics
        type: string
      id:
        example: 1
        type: integer
      teacher:
        $ref: '#/definitions/model.User'
      title:
        example: Math 101
        maxLength: 100
        minLength: 3
        type: string
      updated_at:
        example: "2025-04-18T12:00:00Z"
        type: string
    required:
    - title
    type: object
  model.Role:
    enum:
    - student
    - teacher
    - admin
    type: string
    x-enum-varnames:
    - Student
    - Teacher
    - Admin
  model.Submission:
    properties:
      assignment:
        $ref: '#/definitions/model.Assignment'
      assignmentID:
        type: integer
      content:
        type: string
      createdAt:
        type: string
      grade:
        type: number
      id:
        type: integer
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
      userID:
        type: integer
    required:
    - assignmentID
    - userID
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      password:
        maxLength: 255
        minLength: 8
        type: string
      points:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - student
        - teacher
        - admin
      updated_at:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для обучающего приложения ProjectSchool
  title: ProjectSchool API
  version: "1.0"
paths:
  /assignments:
    post:
      consumes:
      - application/json
      description: 'Создает новое задание для курса. Требуется JWT-токен. Доступно
        только для ролей: teacher, admin.'
      parameters:
      - description: Данные задания
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/model.Assignment'
      produces:
      - application/json
      responses:
        "200":
          description: message, assignment
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать задание
      tags:
      - assignments
  /assignments/{id}/submit:
    post:
      consumes:
      - application/json
      description: 'Отправляет решение для задания. Требуется JWT-токен. Доступно
        только для роли: student.'
      parameters:
      - description: ID задания
        in: path
        name: id
        required: true
        type: integer
      - description: Содержимое решения
        in: body
        name: submission
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message, submission
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Отправить решение
      tags:
      - submissions
  /courses:
    get:
      consumes:
      - application/json
      description: 'Возвращает список всех курсов с пагинацией. Требуется JWT-токен.
        Доступно для ролей: student, teacher, admin.'
      parameters:
      - default: 10
        description: Лимит записей
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Course'
            type: array
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить список курсов
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: 'Создает новый курс. TeacherID устанавливается автоматически из
        токена авторизации. Требуется JWT-токен. Доступно только для ролей: teacher,
        admin.'
      parameters:
      - description: Данные курса
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCourseInput'
      produces:
      - application/json
      responses:
        "200":
          description: message, course" example={"message":"Курс создан","course":{"id":1,"title":"Math
            101","description":"Introduction to Mathematics","teacher":{"id":1,"username":"teacher1","email":"teacher1@example.com","role":"teacher","points":0,"created_at":"2025-04-18T12:00:00Z","updated_at":"2025-04-18T12:00:00Z"},"created_at":"2025-04-18T12:00:00Z","updated_at":"2025-04-18T12:00:00Z"}}
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Создать курс
      tags:
      - courses
  /courses/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет курс. Требуется JWT-токен. Доступно только для преподавателя
        курса или админа.
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Удалить курс
      tags:
      - courses
    get:
      consumes:
      - application/json
      description: 'Возвращает данные курса по его ID. Требуется JWT-токен. Доступно
        для ролей: student, teacher, admin.'
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Course'
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить курс
      tags:
      - courses
  /courses/{id}/assignments:
    get:
      consumes:
      - application/json
      description: 'Возвращает список заданий для указанного курса. Требуется JWT-токен.
        Доступно для ролей: student, teacher, admin.'
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Assignment'
            type: array
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить список заданий
      tags:
      - assignments
  /courses/{id}/enroll:
    delete:
      consumes:
      - application/json
      description: 'Отменяет запись аутентифицированного студента на курс. Требуется
        JWT-токен. Доступно только для роли: student.'
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Отменить запись на курс
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: 'Записывает аутентифицированного студента на курс. Требуется JWT-токен.
        Доступно только для роли: student.'
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Записаться на курс
      tags:
      - courses
  /courses/{id}/stats:
    get:
      consumes:
      - application/json
      description: 'Возвращает статистику курса (количество студентов, средняя оценка,
        процент завершения). Требуется JWT-токен. Доступно для ролей: teacher, admin.'
      parameters:
      - description: ID курса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: students_count, average_grade, completion_rate
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Получить статистику курса
      tags:
      - courses
  /leaderboard:
    get:
      consumes:
      - application/json
      description: 'Возвращает топ-10 пользователей по баллам, опционально для конкретного
        курса. Требуется JWT-токен. Доступно для ролей: student, teacher, admin.'
      parameters:
      - description: ID курса для фильтрации
        in: query
        name: course_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить таблицу лидеров
      tags:
      - leaderboard
  /login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и возвращает JWT-токен. Доступно без
        авторизации.
      parameters:
      - description: Учетные данные
        in: body
        name: credentials
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message, token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход пользователя
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя и возвращает JWT-токен. Доступно
        без авторизации.
      parameters:
      - description: Данные пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: message, token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /submissions/{id}/grade:
    put:
      consumes:
      - application/json
      description: 'Устанавливает оценку для решения. Требуется JWT-токен. Доступно
        только для ролей: teacher, admin.'
      parameters:
      - description: ID решения
        in: path
        name: id
        required: true
        type: integer
      - description: Оценка (0-5)
        in: body
        name: grade
        required: true
        schema:
          additionalProperties:
            type: number
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Установить оценку
      tags:
      - submissions
  /users/{id}/role:
    put:
      consumes:
      - application/json
      description: 'Обновляет роль указанного пользователя. Требуется JWT-токен. Доступно
        только для роли: admin.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Новая роль
        in: body
        name: role
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/error.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/error.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/error.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/error.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error.APIError'
      security:
      - BearerAuth: []
      summary: Обновить роль пользователя
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: 'Возвращает данные текущего аутентифицированного пользователя.
        Требуется JWT-токен. Доступно для ролей: student, teacher, admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя
      tags:
      - users
  /users/me/submissions:
    get:
      consumes:
      - application/json
      description: 'Возвращает все решения текущего аутентифицированного пользователя.
        Требуется JWT-токен. Доступно для ролей: student, teacher, admin.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Submission'
            type: array
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить решения пользователя
      tags:
      - submissions
securityDefinitions:
  BearerAuth:
    description: Enter the JWT token with the "Bearer " prefix, e.g., "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
